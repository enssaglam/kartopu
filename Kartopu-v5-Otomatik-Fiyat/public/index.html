<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Kartopu — Temettü Takip</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12281F">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kartopu">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
  try {
    var saved = JSON.parse(localStorage.getItem('kartopu_v1') || '{}');
    if (saved.settings && saved.settings.theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
